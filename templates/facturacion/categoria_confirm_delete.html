{% extends "base.html" %}

{% block title %}Eliminar Categoría - Mi Tienda{% endblock %}

{% block extra_css %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card border-danger shadow">
            <div class="card-body text-center">
                <h3 class="text-danger">¿Estás seguro?</h3>
                <p class="mt-3">¿Deseas eliminar la categoría: <strong>{{ object.nombre }}</strong>?</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger w-100">Sí, eliminar</button>
                </form>
                <a href="{% url 'facturacion:categoria_list' %}" class="btn btn-secondary w-100 mt-2">Cancelar</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
